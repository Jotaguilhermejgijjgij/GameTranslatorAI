name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          mkdir android-project
          unzip -q GameTranslatorAI.zip -d android-project

      - name: Encontrar projeto
        run: |
          PROJECT_DIR=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Encontrar APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Nenhum APK foi encontrado."
            exit 1
          fi
          echo "APK encontrado: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/GameTranslatorAI.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: GameTranslatorAI-APK
          path: GameTranslatorAI.apk
